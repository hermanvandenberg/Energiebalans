# Haalt elke ochtend de data op, en meteen nadat je op het dashboard instellingen opslaat (invoer/).
# Alleen PRIVE_SLEUTEL staat in GitHub Secrets; al het andere staat versleuteld in de repo.
name: Data ophalen
on:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths: ["invoer/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  data:
    if: github.repository == 'hermanvandenberg/Energiebalans'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # de nieuwste stand bij de start, niet die van het moment van in de rij zetten: anders een verlopen SolarEdge-token
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Ophalen, versleutelen en pushen
        env:
          TZ: Europe/Amsterdam
          PRIVE_SLEUTEL: ${{ secrets.PRIVE_SLEUTEL }}
        run: |
          test -n "$PRIVE_SLEUTEL" || { echo "Secret PRIVE_SLEUTEL ontbreekt (python haal_data_op.py --sleutel)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python haal_data_op.py
